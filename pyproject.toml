[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flmint"
version = "0.1.0"
description = "Non-destructive FL Studio on Linux compatibility and reproducibility toolkit (Phase 0/1)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Soham" }]

[project.scripts]
flmint = "flmint.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "mypy>=1.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C901"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/flmint"]
