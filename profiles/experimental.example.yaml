# flmint experimental profile (example). Separate prefix; audio-bridge experiments only.
# The PipeASIO step is gated: builds require PipeWire >= 1.4.2 (upstream documented
# prerequisite). Gate status is evaluated from live doctor facts, never assumed.
name: experimental
title: Experimental FL Studio with PipeASIO/WineASIO candidates
description: "Second isolated prefix for patched-runner and ASIO-bridge experiments. Must never be used as the production environment; snapshot before and after each change."
installer_required: true
min_disk_mib: 16384
components:
  - id: bottles
    kind: flatpak
    name: com.usebottles.bottles
    version: null
    source_url: https://flathub.org/apps/com.usebottles.bottles
    sha256: null
    license: GPL-3.0-only
    notes: "Flathub 67.5 verified (GPL-3.0-only). Note: PipeASIO upstream release notes say Flatpak (Steam/Bottles) is unsupported, so a Flatpak prefix is not a PipeASIO host." 
  - id: daw-ge-proton
    kind: download
    name: DAW-GE-Proton
    version: null
    source_url: https://github.com/KitsuneDev/daw-proton-ge/releases
    sha256: null
    license: GPL-3.0
    notes: "Candidate customized runner; pin release + SHA-256 first. Candidate digest for DAW-GE-Proton11-6c is recorded, license unverified." 
  - id: pipeasio
    kind: build
    name: PipeASIO
    version: null
    source_url: https://github.com/M0n7y5/pipeasio
    sha256: null
    license: GPL-3.0
    notes: "Native PipeWire ASIO bridge. Upstream v1.10.0 prerequisites: PipeWire >= 1.4.2, glibc >= 2.38, built against wine-11.18; Flatpak prefixes unsupported per release notes, so this needs a non-Flatpak Wine prefix (approval required)." 
  - id: wineasio
    kind: build
    name: WineASIO
    version: null
    source_url: https://github.com/wineasio/wineasio
    sha256: null
    license: GPL-2.0-or-later
    notes: ASIO-to-JACK fallback where PipeASIO registration is impractical (e.g. Flatpak sandbox).
gates:
  - id: pipewire-ge-1.4.2
    kind: pipewire_min
    min_version: 1.4.2
    applies_to: pipeasio
human_checklist:
  - Snapshot the experimental prefix before every audio-bridge change.
  - Register ASIO DLLs per-prefix only; never system-wide.
  - Measure (never assume) latency and XRUN behavior at 1024/512/256 frames.
